name: Tests
  
on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  linux:
    name: Linux SPM unit tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Swift version
        id: swift-version
        run: |
          echo "SWIFT_VERSION=$(swift --version|head -1|cut -d' ' -f3)" >> $GITHUB_ENV
        shell: bash

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm6-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved', 'Makefile') }}

      - name: Run tests
        run: swift test

  macos:
    name: Xcode 27 tests
    runs-on: xcode-27
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm5-${{ hashFiles('Package.resolved', 'Makefile') }}

      - name: SPM tests
        run: make test
